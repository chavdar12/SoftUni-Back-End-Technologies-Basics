# Run with: docker compose -f 021-Containers-Docker-and-Docker-Compose/compose.yaml up --build
# Then open http://localhost:8080/api/notes
services:
  notes-api:
    build:
      context: ..
      dockerfile: 021-Containers-Docker-and-Docker-Compose/NotesApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
